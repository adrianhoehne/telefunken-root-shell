[global]
   server min protocol = NT1
   server max protocol = SMB3
   map to guest = bad user
   guest ok = yes
   security = user
   log level = 1

[mb211cifs]
   path = /srv/mb211cifs
   browseable = yes
   read only = yes
   guest ok = yes
   hosts allow = 192.168.0.0/24 127.0.0.1  # TODO: set LAN
