[global]
   server min protocol = NT1
   server max protocol = SMB3
   map to guest = bad user
   guest ok = yes
   security = user
   log level = 1

[mb211cifs]
   path = /srv/mb211cifs
   browseable = yes
   read only = no
   guest ok = yes
   hosts allow = 192.168.178.0/24 127.0.0.1
   force user = root
   create mask = 0644
   directory mask = 0755
